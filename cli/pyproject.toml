[project]
name = "x-media-archiver-cli"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "typer",
  "rich",
  "pydantic",
  "pydantic-settings",
  "alembic",
  "orjson",
  "psycopg[binary]",
  "psycopg_pool",
  "python-dotenv",
  "gallery-dl",
  "yt-dlp",
  "fastapi",
  "uvicorn[standard]",
  "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["xarchiver"]
